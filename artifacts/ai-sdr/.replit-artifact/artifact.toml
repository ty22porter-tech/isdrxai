kind = "web"
previewPath = "/app/"
title = "iSDRX AI – Janitorial Outreach"
version = "1.0.0"
id = "artifacts/ai-sdr"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/app/" ]
localPort = 25069

[services.development]
run = "pnpm --filter @workspace/ai-sdr run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-sdr", "run", "build" ]
publicDir = "artifacts/ai-sdr/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25069"
BASE_PATH = "/app/"
