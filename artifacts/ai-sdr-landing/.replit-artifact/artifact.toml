kind = "web"
previewPath = "/ai-sdr-landing/"
title = "iSDRX AI – Landing Page"
version = "1.0.0"
id = "artifacts/ai-sdr-landing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/ai-sdr-landing/" ]
localPort = 18443

[services.development]
run = "pnpm --filter @workspace/ai-sdr-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-sdr-landing", "run", "build" ]
publicDir = "artifacts/ai-sdr-landing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18443"
BASE_PATH = "/ai-sdr-landing/"
