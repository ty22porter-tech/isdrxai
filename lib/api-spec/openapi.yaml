openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: iSDRX AI API for janitorial company outreach
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: prospects
    description: Prospect management
  - name: campaigns
    description: Campaign management
  - name: emails
    description: Email outreach
  - name: calls
    description: Call tracking
  - name: appointments
    description: Appointments and walkthroughs
  - name: ai
    description: AI generation
  - name: openai
    description: OpenAI-powered generation
  - name: stats
    description: Dashboard stats
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /:
    get:
      operationId: apiLivenessCheck
      tags: [health]
      summary: API base-path liveness check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /health:
    get:
      operationId: deepHealthCheck
      tags: [health]
      summary: Deep health check — verifies each major database table is queryable
      responses:
        "200":
          description: All checks passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealthStatus"
        "503":
          description: One or more checks failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealthStatus"

  /prospects:
    get:
      operationId: listProspects
      tags: [prospects]
      summary: List all prospects
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: campaignId
          in: query
          schema:
            type: ["integer", "null"]
        - name: sentFrom
          in: query
          description: Include prospects emailed on or after this UTC calendar date (YYYY-MM-DD)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: sentTo
          in: query
          description: Include prospects emailed on or before this UTC calendar date (YYYY-MM-DD)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: List of prospects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prospect"
    post:
      operationId: createProspect
      tags: [prospects]
      summary: Create a prospect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prospect"

  /prospects/bulk:
    post:
      operationId: bulkCreateProspects
      tags: [prospects]
      summary: Create many prospects at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkProspectsInput"
      responses:
        "200":
          description: Per-row results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkProspectsResult"

  /prospects/bulk-delete:
    post:
      operationId: bulkDeleteProspects
      tags: [prospects]
      summary: Delete many prospects at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteInput"
      responses:
        "200":
          description: Number of prospects deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteResult"

  /prospects/bulk-enrich:
    post:
      operationId: bulkEnrichProspects
      tags: [prospects]
      summary: Enrich many prospects via Apollo people enrichment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkEnrichInput"
      responses:
        "200":
          description: Per-prospect enrichment results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkEnrichResult"

  /prospects/{id}:
    get:
      operationId: getProspect
      tags: [prospects]
      summary: Get a prospect by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Prospect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prospect"
    patch:
      operationId: updateProspect
      tags: [prospects]
      summary: Update a prospect
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectUpdate"
      responses:
        "200":
          description: Updated prospect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prospect"
    delete:
      operationId: deleteProspect
      tags: [prospects]
      summary: Delete a prospect
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List campaigns
      responses:
        "200":
          description: List of campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"

  /campaigns/{id}:
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get campaign by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Update a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdate"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a campaign
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /emails:
    get:
      operationId: listEmails
      tags: [emails]
      summary: List email outreach records
      parameters:
        - name: prospectId
          in: query
          schema:
            type: ["integer", "null"]
        - name: campaignId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of emails
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Email"
    post:
      operationId: createEmail
      tags: [emails]
      summary: Save a sent email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"

  /emails/{id}:
    patch:
      operationId: updateEmail
      tags: [emails]
      summary: Update email status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailUpdate"
      responses:
        "200":
          description: Updated email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Email"

  /calls:
    get:
      operationId: listCalls
      tags: [calls]
      summary: List call records
      parameters:
        - name: prospectId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: List of calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"
    post:
      operationId: createCall
      tags: [calls]
      summary: Log a call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"

  /calls/{id}:
    patch:
      operationId: updateCall
      tags: [calls]
      summary: Update a call record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CallUpdate"
      responses:
        "200":
          description: Updated call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Call"

  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointments
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Create an appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{id}:
    patch:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdate"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
    delete:
      operationId: deleteAppointment
      tags: [appointments]
      summary: Delete an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /openai/generate-email:
    post:
      operationId: openaiGenerateEmail
      tags: [openai]
      summary: Generate a personalized email using OpenAI GPT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiGenerateEmailRequest"
      responses:
        "200":
          description: Generated email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedEmail"

  /ai/generate-email:
    post:
      operationId: generateEmail
      tags: [ai]
      summary: AI-generate a personalized email for a prospect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateEmailRequest"
      responses:
        "200":
          description: Generated email content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedEmail"

  /ai/generate-call-script:
    post:
      operationId: generateCallScript
      tags: [ai]
      summary: AI-generate a call script for a prospect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCallScriptRequest"
      responses:
        "200":
          description: Generated call script
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedCallScript"

  /ai/prospect-search:
    post:
      operationId: prospectSearch
      tags: [ai]
      summary: Search real local businesses (Google Places) for a given city, state, and industry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectSearchRequest"
      responses:
        "200":
          description: Generated prospect leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProspectLead"

  /ai/enrich-leads:
    post:
      operationId: enrichLeads
      tags: [ai]
      summary: Find the real decision-maker name and email for unsaved search leads (Apollo people search)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrichLeadsRequest"
      responses:
        "200":
          description: Per-lead enrichment results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrichLeadsResult"

  /stats/dashboard:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /stats/activity:
    get:
      operationId: getActivityFeed
      tags: [stats]
      summary: Get recent activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    DeepHealthStatus:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: string

    Prospect:
      type: object
      required: [id, companyName, contactName, email, phone, industry, city, state, status, createdAt]
      properties:
        id:
          type: integer
        companyName:
          type: string
        contactName:
          type: string
        email:
          type: string
        phone:
          type: string
        industry:
          type: string
        city:
          type: string
        state:
          type: string
        website:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        opportunityIntelligence:
          oneOf:
            - $ref: "#/components/schemas/OpportunityIntelligence"
            - type: "null"
        employeeCount:
          type: ["integer", "null"]
        squareFootage:
          type: ["integer", "null"]
        status:
          type: string
          enum: [new, contacted, interested, qualified, appointment_set, closed_won, closed_lost]
        lastContactedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        title:
          type: ["string", "null"]
        linkedinUrl:
          type: ["string", "null"]
        enrichedAt:
          type: ["string", "null"]

    ProspectInput:
      type: object
      required: [companyName, contactName, email, phone, industry, city, state]
      properties:
        companyName:
          type: string
        contactName:
          type: string
        email:
          type: string
        phone:
          type: string
        industry:
          type: string
        city:
          type: string
        state:
          type: string
        website:
          type: string
        address:
          type: string
        notes:
          type: string
        opportunityIntelligence:
          $ref: "#/components/schemas/OpportunityIntelligence"
        employeeCount:
          type: integer
        squareFootage:
          type: integer
        title:
          type: string
        linkedinUrl:
          type: string
          format: uri

    BulkProspectsInput:
      type: object
      required: [prospects]
      properties:
        prospects:
          type: array
          items:
            $ref: "#/components/schemas/ProspectInput"
        duplicateStrategy:
          type: string
          enum: [skip, update]
          default: skip
          description: How to handle rows whose email matches an existing prospect. "skip" fails the row; "update" merges new data into the existing prospect.

    BulkDeleteInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            type: integer

    BulkEnrichInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer

    BulkEnrichResult:
      type: object
      required: [enriched, skipped, failed]
      properties:
        enriched:
          type: integer
        skipped:
          type: integer
        failed:
          type: integer
        planBlocked:
          type: boolean
          description: True when Apollo rejected the request because the account plan has no API access.
        errors:
          type: array
          items:
            type: string

    BulkDeleteResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer

    BulkProspectsResult:
      type: object
      required: [added, failed, results]
      properties:
        added:
          type: integer
        updated:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/BulkProspectRowResult"

    BulkProspectRowResult:
      type: object
      required: [index, success]
      properties:
        index:
          type: integer
        success:
          type: boolean
        updated:
          type: boolean
        error:
          type: string
        prospect:
          $ref: "#/components/schemas/Prospect"

    ProspectUpdate:
      type: object
      properties:
        companyName:
          type: string
        contactName:
          type: string
        email:
          type: string
        phone:
          type: string
        industry:
          type: string
        city:
          type: string
        state:
          type: string
        website:
          type: string
        notes:
          type: string
        employeeCount:
          type: integer
        squareFootage:
          type: integer
        status:
          type: string

    Campaign:
      type: object
      required: [id, name, status, type, targetIndustry, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [draft, active, paused, completed]
        type:
          type: string
          enum: [email, call, mixed]
        targetIndustry:
          type: string
        description:
          type: ["string", "null"]
        emailTemplate:
          type: ["string", "null"]
        callScript:
          type: ["string", "null"]
        prospectCount:
          type: integer
        emailsSent:
          type: integer
        callsMade:
          type: integer
        appointmentsSet:
          type: integer
        createdAt:
          type: string

    CampaignInput:
      type: object
      required: [name, type, targetIndustry]
      properties:
        name:
          type: string
        type:
          type: string
        targetIndustry:
          type: string
        description:
          type: string
        emailTemplate:
          type: string
        callScript:
          type: string

    CampaignUpdate:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        type:
          type: string
        targetIndustry:
          type: string
        description:
          type: string
        emailTemplate:
          type: string
        callScript:
          type: string

    Email:
      type: object
      required: [id, prospectId, subject, body, status, sentAt]
      properties:
        id:
          type: integer
        prospectId:
          type: integer
        campaignId:
          type: ["integer", "null"]
        subject:
          type: string
        body:
          type: string
        status:
          type: string
          enum: [draft, sent, opened, replied, bounced]
        sentAt:
          type: string
        openedAt:
          type: ["string", "null"]
        repliedAt:
          type: ["string", "null"]

    EmailInput:
      type: object
      required: [prospectId, subject, body]
      properties:
        prospectId:
          type: integer
        campaignId:
          type: integer
        subject:
          type: string
        body:
          type: string
        status:
          type: string

    EmailUpdate:
      type: object
      properties:
        status:
          type: string
        openedAt:
          type: string
        repliedAt:
          type: string

    Call:
      type: object
      required: [id, prospectId, status, createdAt]
      properties:
        id:
          type: integer
        prospectId:
          type: integer
        status:
          type: string
          enum: [scheduled, completed, no_answer, voicemail, callback_requested]
        duration:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        outcome:
          type: ["string", "null"]
        callScript:
          type: ["string", "null"]
        createdAt:
