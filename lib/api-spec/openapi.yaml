        compliancePriority:
          type: string
          description: Optional cybersecurity & compliance priority filter (IT Services vertical)

    EnrichLeadsRequest:
      type: object
      required: [leads]
      properties:
        leads:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [companyName, email]
            properties:
              companyName:
                type: string
              contactName:
                type: string
              email:
                type: string
              website:
                type: string

    EnrichLeadsResult:
      type: object
      required: [results]
      properties:
        planBlocked:
          type: boolean
          description: True when Apollo rejected the request because the account plan has no API access.
        error:
          type: string
          description: Run-level error message (e.g. plan blocked or missing API key).
        results:
          type: array
          items:
            type: object
            required: [index, status]
            properties:
              index:
                type: integer
                description: Index of the lead in the request array.
              status:
                type: string
                enum: [enriched, not_found, failed]
              contactName:
                type: string
              email:
                type: string
              title:
                type: string
              phone:
                type: string
              linkedinUrl:
                type: string
              employeeCount:
                type: integer
              error:
                type: string

    ProspectLead:
      type: object
      required: [companyName, contactName, contactTitle, email, phone, industry, city, state, whyTarget, confidence]
      properties:
        companyName:
          type: string
        contactName:
          type: string
        contactTitle:
          type: string
        email:
          type: string
        phone:
          type: string
        industry:
          type: string
        city:
          type: string
        state:
          type: string
        website:
          type: string
        address:
          type: string
          description: Street address of the business (from Google Places)
        estimatedEmployees:
          type: integer
        estimatedSquareFootage:
          type: integer
        whyTarget:
          type: string
        confidence:
          type: string
          enum: [high, medium, low]
        vertical:
          type: string
          description: Vertical this lead was generated for (janitorial | it_services | fleet_wraps)
        opportunityScore:
          type: integer
          description: IT Opportunity Score 0-100 (IT Services vertical only)
        scoreLabel:
          type: string
          description: High Priority | Strong Fit | Possible Fit | Low Priority
        scoreExplanation:
          type: string
        estimatedLocations:
          type: integer
          description: Estimated number of locations (IT Services vertical only)
        potentialNeeds:
          type: array
          items:
            type: string
          description: Potential IT service needs (IT Services vertical only)
        complianceConsideration:
          type: string
          description: Likely/potential compliance consideration, clearly inferred
        recommendedOutreach:
          type: string
        fleetBrandingSignal:
          type: string
          description: Strongest verified fleet or branding signal, with unconfirmed inferences identified explicitly
        opportunityIntelligence:
          $ref: "#/components/schemas/OpportunityIntelligence"

    OpportunitySignal:
      type: object
      required: [signalType, signalTitle, signalDescription, signalClassification, confidenceLevel, freshness, dateDiscovered, points]
      properties:
        signalType:
          type: string
        signalTitle:
          type: string
        signalDescription:
          type: string
        signalClassification:
          type: string
          enum: [verified, implication, unconfirmed]
        confidenceLevel:
          type: string
          enum: [high, medium, low]
        freshness:
          type: string
          enum: [recent, active, older, stale, unknown]
        sourceName:
          type: string
        sourceURL:
          type: string
          format: uri
        sourceDate:
          type: string
          format: date-time
        dateDiscovered:
          type: string
          format: date-time
        dateVerified:
          type: string
          format: date-time
        supportingEvidence:
          type: string
        relatedSellerCapability:
          type: string
        potentialBusinessImpact:
          type: string
        points:
          type: integer
          minimum: 0
          maximum: 30

    OpportunityScoreCategory:
      type: object
      required: [key, label, points, maxPoints, explanation, evidence]
      properties:
        key:
          type: string
          enum: [company_industry_fit, verified_buying_signals, seller_prospect_match, decision_maker_match, signal_freshness, business_need_potential]
        label:
          type: string
        points:
          type: integer
          minimum: 0
          maximum: 30
        maxPoints:
          type: integer
          minimum: 1
          maximum: 30
        explanation:
          type: string
        evidence:
          type: array
          items:
            type: string

    OpportunityIntelligence:
      type: object
      required: [version, score, label, scoreConfidence, definition, breakdown, signals, whyTarget, potentialNeeds, recommendedOutreach, generatedAt]
      properties:
        version:
          type: integer
          enum: [1]
        score:
          type: integer
          minimum: 0
          maximum: 100
        label:
          type: string
          enum: [High Priority, Strong Fit, Possible Fit, Low Priority]
        scoreConfidence:
          type: string
          enum: [high, medium, low]
        definition:
          type: string
        breakdown:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/OpportunityScoreCategory"
        signals:
          type: array
          items:
            $ref: "#/components/schemas/OpportunitySignal"
        whyTarget:
          type: string
        potentialNeeds:
          type: array
          items:
            type: string
        recommendedOutreach:
          type: string
        generatedAt:
          type: string
          format: date-time

