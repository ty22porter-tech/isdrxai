            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    ClerkBearer:
      type: http
      scheme: bearer
      bearerFormat: Clerk session token
    ClerkSession:
      type: apiKey
      in: cookie
      name: __session
  parameters:
    GiftVideoToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-f0-9]{64}$'
    ByteRange:
      name: Range
      in: header
      required: false
      description: A single byte range
      schema:
        type: string
        pattern: '^bytes=\d*-\d*$'
  schemas:
    GiftVideoUploadInput:
      type: object
      additionalProperties: false
      required: [kind, name, size, contentType]
      properties:
        kind: { type: string, enum: [video, thumbnail] }
        name: { type: string, minLength: 1, maxLength: 255 }
        size:
          type: integer
          minimum: 1
          maximum: 104857600
          description: MP4 maximum 100 MiB; thumbnail maximum 5 MiB
        contentType:
          type: string
          enum: [video/mp4, image/png, image/jpeg, image/webp]
          description: Video requires video/mp4; thumbnail requires PNG, JPEG, or WebP
    GiftVideoUploadReservation:
      type: object
      additionalProperties: false
      required: [uploadId, uploadURL, objectPath, expiresAt]
      properties:
        uploadId: { type: integer }
        uploadURL:
          type: string
          format: uri
          description: PUT the exact file bytes here with the reserved Content-Type
        objectPath:
          type: string
          description: Informational private path; save uploadId rather than this value
        expiresAt: { type: string, format: date-time }
    GiftVideoFields:
      type: object
      required: [uploadId, title, prospectName, giftName, giftSentDate, cta, schedulingLink]
      properties:
        uploadId: { type: integer, minimum: 1 }
        thumbnailUploadId:
          type: [integer, "null"]
          minimum: 1
          description: A thumbnail reservation; null removes a custom thumbnail on update
        title: { type: string, minLength: 1, maxLength: 200 }
        prospectName: { type: string, minLength: 1, maxLength: 200 }
        giftName: { type: string, minLength: 1, maxLength: 200 }
        giftSentDate:
          type: string
          format: date
        cta: { type: string, minLength: 1, maxLength: 500 }
        schedulingLink:
          type: string
          format: uri
          pattern: '^https://'
        introduction: { type: string, maxLength: 3000, default: "" }
        transcript: { type: string, maxLength: 30000, default: "" }
        showNameOnThumbnail: { type: boolean, default: true }
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: Future timestamp, or null for no expiration
    GiftVideoInput:
      unevaluatedProperties: false
      allOf:
        - { $ref: "#/components/schemas/GiftVideoFields" }
        - type: object
          required: [recordId]
          properties:
            recordId: { type: integer, minimum: 1 }
    GiftVideoUpdate:
      type: object
      additionalProperties: false
      description: Any subset of editable video fields; recordId cannot be changed
      properties:
        uploadId: { type: integer, minimum: 1 }
        thumbnailUploadId: { type: [integer, "null"], minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        prospectName: { type: string, minLength: 1, maxLength: 200 }
        giftName: { type: string, minLength: 1, maxLength: 200 }
        giftSentDate: { type: string, format: date }
        cta: { type: string, minLength: 1, maxLength: 500 }
        schedulingLink: { type: string, format: uri, pattern: '^https://' }
        introduction: { type: string, maxLength: 3000 }
        transcript: { type: string, maxLength: 30000 }
        showNameOnThumbnail: { type: boolean }
        expiresAt: { type: [string, "null"], format: date-time }
    GiftVideo:
      type: object
      additionalProperties: false
      required: [id, recordId, prospectId, campaignId, emailId, title, prospectName, giftName, giftSentDate, cta, schedulingLink, introduction, transcript, showNameOnThumbnail, expiresAt, durationSeconds, hasThumbnail, createdAt, updatedAt, watchUrl, posterUrl, analyticsAvailable]
      properties:
        id: { type: integer }
        recordId: { type: integer }
        prospectId: { type: integer }
        campaignId: { type: integer }
        emailId: { type: [integer, "null"] }
        title: { type: string }
        prospectName: { type: string }
        giftName: { type: string }
        giftSentDate: { type: string, format: date }
        cta: { type: string }
        schedulingLink: { type: string, format: uri }
        introduction: { type: string }
        transcript: { type: string }
        showNameOnThumbnail: { type: boolean }
        expiresAt: { type: [string, "null"], format: date-time }
        durationSeconds: { type: number, minimum: 0 }
        hasThumbnail: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        watchUrl: { type: string, format: uri-reference }
        posterUrl: { type: string, format: uri-reference }
        analyticsAvailable: { type: boolean, const: true }
    GiftVideoDeleteResult:
      type: object
      additionalProperties: false
      required: [deleted]
      properties:
        deleted: { type: boolean, const: true }
    GiftVideoActions:
      type: object
      additionalProperties: false
      required: [call, email, viewProspect, scheduleFollowUp]
      properties:
        call: { type: [string, "null"], description: tel URL when a phone number exists }
        email: { type: string, description: mailto URL }
        viewProspect: { type: string, pattern: '^/prospects/' }
        scheduleFollowUp: { type: string, pattern: '^/prospects/.+\?action=schedule$' }
    GiftVideoDashboardCard:
      type: object
      additionalProperties: false
      required: [video, prospectId, prospectName, company, campaignId, campaignName, step, status, sentAt, delivered, deliveredAt, emailOpened, emailOpenedAt, videoClicked, firstClickedAt, lastClickedAt, totalClicks, uniqueClicks, repeatClicks, videoStarted, watchPercentage, analyticsAvailable, analyticsLabel, schedulingLinkClicked, discoveryCallBooked, replied, repliedAt, engagementScore, leadStrength, nextAction, actions]
      properties:
        video: { $ref: "#/components/schemas/GiftVideo" }
        prospectId: { type: integer }
        prospectName: { type: string }
        company: { type: string }
        campaignId: { type: integer }
        campaignName: { type: string }
        step: { type: string, const: "Step 3 – Gift Follow-Up" }
        status:
          type: string
          enum: [Discovery Call Booked, Scheduling Link Clicked, Video Completed, Video Partially Watched, Video Started, Video Clicked, Video Not Clicked, Email Opened, Video Email Delivered, Video Email Sent, Video Email Scheduled]
        sentAt: { type: [string, "null"], format: date-time }
        delivered: { type: boolean }
        deliveredAt: { type: [string, "null"], format: date-time }
        emailOpened: { type: boolean }
        emailOpenedAt: { type: [string, "null"], format: date-time }
        videoClicked: { type: boolean }
        firstClickedAt: { type: [string, "null"], format: date-time }
        lastClickedAt: { type: [string, "null"], format: date-time }
        totalClicks: { type: integer, minimum: 0 }
        uniqueClicks: { type: integer, minimum: 0 }
        repeatClicks: { type: integer, minimum: 0 }
        videoStarted: { type: boolean }
        watchPercentage: { type: number, minimum: 0, maximum: 100 }
        analyticsAvailable: { type: boolean, const: true }
        analyticsLabel: { type: string }
        schedulingLinkClicked: { type: boolean }
        discoveryCallBooked: { type: boolean }
        replied: { type: boolean }
        repliedAt: { type: [string, "null"], format: date-time }
        engagementScore: { type: integer }
        leadStrength: { type: string, enum: [Hot, Medium, Low] }
        nextAction: { type: string }
        actions: { $ref: "#/components/schemas/GiftVideoActions" }
    GiftVideoDashboard:
      type: object
      additionalProperties: false
      required: [cards, trackingNotice]
      properties:
        cards:
          type: array
          items: { $ref: "#/components/schemas/GiftVideoDashboardCard" }
        trackingNotice: { type: string }
    GiftVideoEvent:
      type: object
      additionalProperties: false
      required: [id, type, occurredAt, isBot, isValid, detail, percentage]
      properties:
        id: { type: string }
        type: { type: string }
        occurredAt: { type: string, format: date-time }
        isBot: { type: boolean }
        isValid: { type: boolean }
        detail: { type: string }
        percentage: { type: [number, "null"], minimum: 0, maximum: 100 }
    GiftVideoTimeline:
      type: object
      additionalProperties: false
      required: [events, trackingNotice]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/GiftVideoEvent" }
        trackingNotice: { type: string }
    GiftVideoProgressInput:
      type: object
      additionalProperties: false
      required: [sessionId, position, playing, seeking, ranges]
      properties:
        sessionId: { type: string, pattern: '^[a-f0-9]{48}$' }
        position: { type: number, minimum: 0 }
        playing: { type: boolean }
        seeking: { type: boolean }
        ranges:
          type: array
          maxItems: 100
          items:
            type: array
            prefixItems:
              - { type: number }
              - { type: number }
            minItems: 2
            maxItems: 2
    GiftVideoProgressResult:
      type: object
      additionalProperties: false
      required: [watchPercentage]
      properties:
        watchPercentage: { type: [number, "null"], minimum: 0, maximum: 100 }
        retryAfterMs:
          type: integer
          minimum: 1
          description: Suggested delay before retrying when the report was throttled
    GiftOutreachSettingsInput:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean, default: false }
        defaultMethod: { type: string, enum: [email, video, per_prospect], default: email }
        daysAfterDelivery: { type: integer, minimum: 1, maximum: 10, default: 1 }
        sentOnlyBusinessDays: { type: integer, minimum: 3, maximum: 5, default: 3 }
        industry: { type: string }
        serviceDescriptions: { type: string }
        discussionPoints: { type: string }
        schedulingLink: { type: string, description: HTTPS URL or empty to use the prospect scheduling page }
        emailSignature: { type: string, description: Plain-text replacement signature, composed exactly once }
        videoHostingPreference: { type: string, enum: [managed] }
        videoCta: { type: string }
        businessHoursStart: { type: string, example: "09:00" }
        businessHoursEnd: { type: string, example: "17:00" }
        timezone: { type: string, example: America/New_York }
        allowedDays:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1, maximum: 5 }
          description: ISO weekdays Monday=1 through Friday=5; weekends excluded
        automationLevel: { type: string, enum: [auto, review, manual], default: review }
        videoFallback: { type: string, enum: [pause, email], default: pause }
        maxFollowUpAttempts: { type: integer, minimum: 1, maximum: 5, default: 1 }
    GiftSuggestionInput:
      type: object
      additionalProperties: false
      required: [budgetUsd]
      properties:
        budgetUsd: { type: integer, minimum: 10, maximum: 100, default: 25 }
    GiftSuggestionPreviewInput:
      type: object
      additionalProperties: false
      required: [budgetUsd, contactName, companyName, industry]
      properties:
        budgetUsd: { type: integer, minimum: 10, maximum: 100, default: 25 }
        contactName: { type: string, minLength: 2, maxLength: 160 }
        companyName: { type: string, minLength: 2, maxLength: 200 }
        industry: { type: string, minLength: 2, maxLength: 160 }
        title: { type: ["string", "null"], maxLength: 160 }
        city: { type: ["string", "null"], maxLength: 120 }
        state: { type: ["string", "null"], maxLength: 80 }
    GiftSuggestionIdea:
      type: object
      additionalProperties: false
      required: [name, description, estimatedPriceMinUsd, estimatedPriceMaxUsd, whyFit, personalization, evidenceFactIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, minLength: 1, maxLength: 400 }
        estimatedPriceMinUsd: { type: integer, minimum: 10, maximum: 100 }
        estimatedPriceMaxUsd: { type: integer, minimum: 10, maximum: 100 }
        whyFit: { type: string, minLength: 1, maxLength: 400 }
        personalization: { type: string, enum: [verified_fact, generic_fallback] }
        evidenceFactIds:
          type: array
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 80 }
        offerComparison:
          anyOf:
            - { $ref: "#/components/schemas/GiftOfferComparison" }
            - { type: "null" }
    GiftMerchantOffer:
      type: object
      additionalProperties: false
      required: [itemName, merchant, itemPriceUsd, shippingKnown, availability, url, priceExcerpt, sourceCheckedAt]
      properties:
        itemName: { type: string, minLength: 1, maxLength: 200 }
        merchant: { type: string, minLength: 1, maxLength: 120 }
