openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: iSDRX AI API for janitorial company outreach
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: prospects
    description: Prospect management
  - name: campaigns
    description: Campaign management
  - name: emails
    description: Email outreach
  - name: calls
    description: Call tracking
  - name: appointments
    description: Appointments and walkthroughs
  - name: ai
    description: AI generation
  - name: openai
    description: OpenAI-powered generation
  - name: stats
    description: Dashboard stats
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: gift-videos
    description: Managed personalized gift videos and engagement analytics
paths:
  /gift-outreach/settings:
    get:
      operationId: getGiftOutreachSettings
      tags: [gift-outreach]
      summary: Read Professional Gift Outreach settings (disabled and review required by default)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftOutreachSettings" }
    patch:
      operationId: patchGiftOutreachSettings
      tags: [gift-outreach]
      summary: Update settings; invalidate existing unsent approvals without remapping enrollments
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiftOutreachSettingsInput" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftOutreachSettings" }
  /gift-outreach/records:
    get:
      operationId: listGiftOutreachRecords
      tags: [gift-outreach]
      parameters:
        - { name: prospectId, in: query, schema: { type: integer } }
        - { name: campaignId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Scoped gift records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GiftOutreachRecord" }
    post:
      operationId: createGiftOutreachRecord
      tags: [gift-outreach]
      summary: Create a prospect gift record; explicitly opt in an existing enrollment only before its first follow-up
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiftOutreachRecordInput" }
      responses:
        "201":
          description: Created or existing record (idempotent per campaign/prospect)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftOutreachRecord" }
  /gift-outreach/prospects/{prospectId}:
    get:
      operationId: listProspectGiftOutreachRecords
      tags: [gift-outreach]
      parameters:
        - { name: prospectId, in: path, required: true, schema: { type: integer } }
        - { name: campaignId, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Scoped prospect gift records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GiftOutreachRecord" }
  /gift-outreach/prospects/{prospectId}/suggestions:
    parameters:
      - { name: prospectId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getProspectGiftSuggestions
      tags: [gift-outreach]
      summary: Read persisted gift suggestions for an owned prospect
      responses:
        "200":
          description: Suggestions, or null when none have been generated
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: "#/components/schemas/ProspectGiftSuggestions" }
                  - { type: "null" }
    post:
      operationId: generateProspectGiftSuggestions
      tags: [gift-outreach]
      summary: Generate and persist practical prospect-specific gift suggestions without sending or purchasing anything
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiftSuggestionInput" }
      responses:
        "200":
          description: Validated and persisted suggestions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProspectGiftSuggestions" }
        "400":
          description: Invalid budget
        "404":
          description: Prospect not found for this tenant
        "502":
          description: AI provider failed or returned invalid suggestions
  /gift-outreach/prospect-suggestion-preview:
    post:
      operationId: previewProspectGiftSuggestions
      tags: [gift-outreach]
      summary: Generate stateless gift suggestions for an unsaved authenticated prospect without creating any record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiftSuggestionPreviewInput" }
      responses:
        "200":
          description: Ephemeral suggestions; this endpoint performs no pipeline, gift-record, enrollment, send, or purchase writes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProspectGiftSuggestions" }
        "400":
          description: Invalid or insufficient prospect identity
        "502":
          description: Google grounded research or AI suggestion generation failed
  /gift-outreach/prospects/{prospectId}/suggestions/{ideaIndex}/offers:
    parameters:
      - { name: prospectId, in: path, required: true, schema: { type: integer } }
      - { name: ideaIndex, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 4 } }
    post:
      operationId: compareGiftSuggestionOffers
      tags: [gift-outreach]
      summary: Research and persist current merchant offers for one saved gift idea
      responses:
        "200":
          description: Source-validated current comparison, possibly with no verified offers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftOfferComparison" }
        "404":
          description: Prospect or saved gift idea not found for this tenant
        "502":
          description: Web research provider unavailable
  /gift-outreach/records/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getGiftOutreachRecord
      tags: [gift-outreach]
      responses:
        "200":
          description: Gift record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftOutreachRecord" }
    patch:
      operationId: patchGiftOutreachRecord
      tags: [gift-outreach]
      summary: Edit an unsent gift record; edits invalidate approval, and metadata edits invalidate the draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiftOutreachRecordEdit" }
      responses:
        "200":
          description: Updated gift record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftOutreachRecord" }
  /gift-outreach/records/{id}/prepare:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: prepareGiftOutreachRecord
      tags: [gift-outreach]
      summary: Generate an unsent GPT-5.4 package follow-up draft
      responses:
        "200":
          description: Draft record (no email sent)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftOutreachRecord" }
  /gift-outreach/records/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: approveGiftOutreachRecord
      tags: [gift-outreach]
      summary: Explicitly approve the current revision (required for review, manual, fallback or compliance risk)
      responses:
        "200":
          description: Approved record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftOutreachRecord" }
  /gift-outreach/records/{id}/send:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: sendGiftOutreachRecord
      tags: [gift-outreach]
      summary: Idempotently send a due approved follow-up within configured business hours
      responses:
        "200":
          description: Provider-acknowledged sent record, or same previously sent record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftOutreachRecord" }
        "409":
          description: Gift, time, approval, video, compliance, attempt, or stop gate blocked sending
  /gift-outreach/records/{id}/skip:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: skipGiftOutreachRecord
      tags: [gift-outreach]
      summary: Explicitly skip the gift action and replacement package follow-up without replaying completed steps
      responses:
        "200":
          description: Skipped record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftOutreachRecord" }
  /gift-videos/uploads/request-url:
    post:
      operationId: requestGiftVideoUploadUrl
      tags: [gift-videos]
      summary: Reserve a private managed-media upload and return its presigned PUT URL
      security:
        - ClerkBearer: []
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiftVideoUploadInput" }
      responses:
        "200":
          description: Upload reservation valid for 15 minutes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftVideoUploadReservation" }
        "400":
          description: Invalid type, media pairing, or size
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /gift-videos:
    post:
      operationId: createGiftVideo
      tags: [gift-videos]
      summary: Create and attach a managed MP4 video to an unsent gift record
      security:
        - ClerkBearer: []
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiftVideoInput" }
      responses:
        "201":
          description: Created video
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftVideo" }
        "400":
          description: Invalid input or upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Scoped gift record not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: Gift record is sent, locked, or already has a video
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /gift-videos/dashboard:
    get:
      operationId: getGiftVideoDashboard
      tags: [gift-videos]
      summary: List scoped gift-video engagement cards
      security:
        - ClerkBearer: []
        - ClerkSession: []
      parameters:
        - { name: campaignId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: prospectId, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Dashboard cards and anonymous-tracking disclosure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftVideoDashboard" }
        "400":
          description: Invalid filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /gift-videos/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getGiftVideo
      tags: [gift-videos]
      security:
        - ClerkBearer: []
        - ClerkSession: []
      responses:
        "200":
          description: Scoped video
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftVideo" }
        "404":
          description: Scoped video not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    patch:
      operationId: updateGiftVideo
      tags: [gift-videos]
      summary: Update an unsent video and invalidate gift approval
      security:
        - ClerkBearer: []
        - ClerkSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiftVideoUpdate" }
      responses:
        "200":
          description: Updated video
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftVideo" }
        "400":
          description: Invalid input or upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Scoped video or gift record not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: Video is sent, locked, deleted, or detached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    delete:
      operationId: deleteGiftVideo
      tags: [gift-videos]
      summary: Delete an unsent video, detach it, and revoke its public token
      security:
        - ClerkBearer: []
        - ClerkSession: []
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftVideoDeleteResult" }
        "404":
          description: Scoped video or gift record not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: Video is sent or locked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /gift-videos/{id}/events:
    get:
      operationId: getGiftVideoEvents
      tags: [gift-videos]
      summary: Get the scoped video, email, reply, and booking timeline newest first
      security:
        - ClerkBearer: []
        - ClerkSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Engagement timeline and anonymous-tracking disclosure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftVideoTimeline" }
        "404":
          description: Scoped video not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /gift-videos/watch/{token}:
    get:
      operationId: getGiftVideoWatchPage
      tags: [gift-videos]
      summary: Render the public self-contained native video player
      security: []
      parameters:
        - { $ref: "#/components/parameters/GiftVideoToken" }
      responses:
        "200":
          description: Player document
          content:
            text/html:
              schema: { type: string }
        "404":
          description: Unavailable player document
          content:
            text/html:
              schema: { type: string }
        "410":
          description: Expired player document
          content:
            text/html:
              schema: { type: string }
        "429":
          description: Rate limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /gift-videos/watch/{token}/media:
    get:
      operationId: streamGiftVideoMedia
      tags: [gift-videos]
      summary: Stream public MP4 media with byte-range support
      security: []
      parameters:
        - { $ref: "#/components/parameters/GiftVideoToken" }
        - { $ref: "#/components/parameters/ByteRange" }
      responses:
        "200":
          description: Complete MP4
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "206":
          description: Requested MP4 byte range
          headers:
            Content-Range: { schema: { type: string } }
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "404":
          description: Token or media not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "410":
          description: Public link expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "416": { description: Unsatisfiable byte range }
  /gift-videos/watch/{token}/poster:
    get:
      operationId: getGiftVideoPoster
      tags: [gift-videos]
      summary: Return a generated raster play-poster PNG without recording a click
      security: []
      parameters:
        - { $ref: "#/components/parameters/GiftVideoToken" }
      responses:
        "200":
          description: Generated PNG poster
          content:
            image/png:
              schema: { type: string, format: binary }
        "404":
          description: Token or optional thumbnail source not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "410":
          description: Public link expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /gift-videos/watch/{token}/thumbnail:
    get:
      operationId: streamGiftVideoThumbnail
      tags: [gift-videos]
      summary: Stream the optional custom thumbnail with byte-range support
      security: []
      parameters:
        - { $ref: "#/components/parameters/GiftVideoToken" }
        - { $ref: "#/components/parameters/ByteRange" }
      responses:
        "200":
          description: Complete thumbnail
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "206":
          description: Requested thumbnail byte range
          headers:
            Content-Range: { schema: { type: string } }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404":
          description: Token or custom thumbnail not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "410":
          description: Public link expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "416": { description: Unsatisfiable byte range }
  /gift-videos/watch/{token}/progress:
    post:
      operationId: reportGiftVideoProgress
      tags: [gift-videos]
      summary: Report server-session and elapsed-time validated playback ranges
      security: []
      parameters:
        - { $ref: "#/components/parameters/GiftVideoToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiftVideoProgressInput" }
      responses:
        "200":
          description: Accepted estimated watch percentage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftVideoProgressResult" }
        "400":
          description: Invalid progress report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: Cross-site playback report rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Public token not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "410":
          description: Public link or playback session expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429":
          description: Rate limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /gift-videos/watch/{token}/schedule:
    get:
      operationId: redirectGiftVideoSchedule
      tags: [gift-videos]
      summary: Record scheduling-link engagement and redirect to the configured HTTPS URL
      security: []
      parameters:
        - { $ref: "#/components/parameters/GiftVideoToken" }
      responses:
        "302":
          description: Scheduling redirect
          headers:
            Location:
              schema: { type: string, format: uri }
        "404":
          description: Public token not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "410":
          description: Public link expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /:
    get:
      operationId: apiLivenessCheck
      tags: [health]
      summary: API base-path liveness check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /health:
    get:
      operationId: deepHealthCheck
      tags: [health]
      summary: Deep health check — verifies each major database table is queryable
      responses:
        "200":
          description: All checks passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealthStatus"
        "503":
          description: One or more checks failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepHealthStatus"

  /prospects:
    get:
      operationId: listProspects
      tags: [prospects]
      summary: List all prospects
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: campaignId
          in: query
          schema:
            type: ["integer", "null"]
        - name: sentFrom
          in: query
          description: Include prospects emailed on or after this UTC calendar date (YYYY-MM-DD)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: sentTo
          in: query
          description: Include prospects emailed on or before this UTC calendar date (YYYY-MM-DD)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: List of prospects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prospect"
    post:
      operationId: createProspect
      tags: [prospects]
      summary: Create a prospect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prospect"
        "409":
          description: The authenticated research handoff expired or no longer matches the prospect identity
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum: [research_refresh_required]

  /prospects/bulk:
    post:
      operationId: bulkCreateProspects
      tags: [prospects]
      summary: Create many prospects at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkProspectsInput"
      responses:
        "200":
          description: Per-row results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkProspectsResult"

  /prospects/bulk-delete:
    post:
      operationId: bulkDeleteProspects
      tags: [prospects]
      summary: Delete many prospects at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteInput"
      responses:
        "200":
          description: Number of prospects deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteResult"

  /prospects/bulk-enrich:
    post:
      operationId: bulkEnrichProspects
      tags: [prospects]
      summary: Enrich many prospects via Apollo people enrichment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkEnrichInput"
      responses:
        "200":
          description: Per-prospect enrichment results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkEnrichResult"

  /prospects/{id}:
    get:
      operationId: getProspect
      tags: [prospects]
      summary: Get a prospect by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Prospect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prospect"
    patch:
      operationId: updateProspect
      tags: [prospects]
      summary: Update a prospect
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProspectUpdate"
      responses:
        "200":
          description: Updated prospect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prospect"
    delete:
      operationId: deleteProspect
      tags: [prospects]
      summary: Delete a prospect
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List campaigns
      responses:
        "200":
