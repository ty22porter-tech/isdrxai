    ItResearch:
      type: object
      required: [selectedIndustry, actualIndustry, industryRelationship, industryExplanation, industrySources, lastResearched, warnings, industryChallenges, prospectConcerns, recommendations]
      properties:
        sellerCompanyName:
          type: string
        selectedIndustry:
          type: string
        actualIndustry:
          type: ["string", "null"]
        industryRelationship:
          type: string
          enum: [match, serves_industry, mismatch, uncertain]
        industryExplanation:
          type: string
        industrySources:
          type: array
          items:
            $ref: "#/components/schemas/ResearchSource"
        lastResearched:
          type: string
          format: date-time
        warnings:
          type: array
          items:
            type: string
        industryChallenges:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ItIndustryChallenge"
        prospectConcerns:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ItProspectConcern"
        recommendations:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/ItResearchRecommendation"

    OpportunityIntelligence:
      type: object
      required: [version, score, label, scoreConfidence, definition, breakdown, signals, whyTarget, potentialNeeds, recommendedOutreach, generatedAt]
      properties:
        version:
          type: integer
          enum: [1, 2, 3]
        score:
          type: integer
          minimum: 0
          maximum: 100
        label:
          type: string
          enum: [High Priority, Strong Fit, Possible Fit, Low Priority]
        scoreConfidence:
          type: string
          enum: [high, medium, low]
        definition:
          type: string
        breakdown:
          type: array
          minItems: 6
          maxItems: 6
          items:
            $ref: "#/components/schemas/OpportunityScoreCategory"
        signals:
          type: array
          items:
            $ref: "#/components/schemas/OpportunitySignal"
        whyTarget:
          type: string
        potentialNeeds:
          type: array
          items:
            type: string
        recommendedOutreach:
          type: string
        generatedAt:
          type: string
          format: date-time
        itResearch:
          $ref: "#/components/schemas/ItResearch"
        researchProof:
          type: string

    DashboardStats:
      type: object
      required: [totalProspects, activeProspects, emailsSent, callsMade, appointmentsSet, appointmentsCompleted, conversionRate, thisWeekActivity]
      properties:
        totalProspects:
          type: integer
        activeProspects:
          type: integer
        emailsSent:
          type: integer
        callsMade:
          type: integer
        appointmentsSet:
          type: integer
        appointmentsCompleted:
          type: integer
        conversionRate:
          type: number
        thisWeekActivity:
          type: integer
        prospectsByStatus:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status:
                type: string
              count:
                type: integer

    OpenaiGenerateEmailRequest:
      type: object
      required: [prospectId, step]
      properties:
        prospectId:
          type: integer
        step:
          type: integer
          enum: [1, 2, 3]
        campaignContext:
          type: string

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [email_sent, call_made, appointment_set, prospect_added, status_changed]
        description:
          type: string
        prospectId:
          type: ["integer", "null"]
        prospectName:
          type: ["string", "null"]
        createdAt:
          type: string
